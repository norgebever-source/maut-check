*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.4}
a{color:var(--link)}

.bar{height:8px;background:#eadcc0;border-radius:6px;overflow:hidden;margin:4px 0 6px}

.sub{font-size:.88rem;opacity:.85;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 14px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;min-height:58px}
.opt .ic{font-size:1.5rem;width:30px;text-align:center}
.opt small{display:block;font-weight:600;opacity:.75;font-size:.78rem}
.opt.sel{border-color:var(--or);background:var(--soft)}
.opt:active{transform:scale(.99)}
.big{width:100%;background:var(--or);color:var(--ink);border:0;border-radius:12px;padding:15px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:14px}
.big[disabled]{opacity:.45}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.back{background:none;border:0;color:var(--link);font:inherit;font-weight:700;cursor:pointer;padding:8px 0}
.skip{background:none;border:0;color:var(--link);font:inherit;text-decoration:underline;cursor:pointer}
input[type=number]{width:100%;font:inherit;font-size:1.4rem;font-weight:800;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cnt .nm{font-weight:700;font-size:.9rem}
.cnt .nm small{display:block;font-weight:600;opacity:.75;font-size:.75rem}
.cnt .ctl{display:flex;align-items:center;gap:6px}
.cnt button{width:40px;height:40px;border-radius:10px;border:0;background:#e9dcc3;font-size:1.3rem;font-weight:800;cursor:pointer;color:var(--ink)}
.cnt b{min-width:24px;text-align:center}
.res{background:var(--card);border:3px solid var(--or);border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(60,36,10,.15)}
.res .lbl{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.res h3{font-size:1.6rem;margin:.1rem 0 .2rem}
.res .tag{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:700}
.res ul{padding-left:18px;margin:8px 0}
.res li{margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:.92rem}
.kv dt{font-weight:800}.kv dd{margin:0}
.est{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.est .sum{font-size:1.25rem;font-weight:800}
.cta{display:block;text-align:center;background:var(--or);color:var(--ink);text-decoration:none;font-weight:800;border-radius:12px;padding:14px;margin-top:12px}
.alt{margin-top:12px;font-size:.88rem;border-top:1px dashed var(--line);padding-top:10px}
.small{font-size:.75rem;opacity:.85;margin-top:12px}
details.all{margin-top:12px;font-size:.82rem}
details.all summary{cursor:pointer;color:var(--link);font-weight:700}
details.all table{width:100%;border-collapse:collapse;margin-top:6px}
details.all td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
</style>
